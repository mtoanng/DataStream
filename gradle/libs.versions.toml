[versions]
agp = "8.2.2"
kotlin = "1.9.21"

# AndroidX core
coreKtx = "1.12.0"
appcompat = "1.6.1"
material = "1.11.0"
constraintLayout = "2.1.4"
swipeRefresh = "1.1.0"
fragmentKtx = "1.6.2"
activityKtx = "1.8.2"
recyclerView = "1.3.2"

# Lifecycle / Navigation
lifecycle = "2.7.0"
navigation = "2.7.6"

# Async
coroutines = "1.7.3"

# Network
retrofit = "2.9.0"
okhttp = "4.12.0"
moshi = "1.15.0"

# Logging
timber = "5.0.1"

# Charts
mpAndroidChart = "v3.1.0"

# Testing
junit = "4.13.2"
mockitoCore = "5.8.0"
mockitoKotlin = "5.2.1"
mockwebserver = "4.12.0"
coreTesting = "2.2.0"
coroutinesTest = "1.7.3"
androidxTestCore = "1.5.0"
androidxJunit = "1.1.5"
espresso = "3.5.1"

[plugins]
android-application       = { id = "com.android.application", version.ref = "agp" }
kotlin-android            = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
navigation-safeargs       = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }

[libraries]
# AndroidX core
androidx-core-ktx          = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat         = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material                   = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout  = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintLayout" }
androidx-swiperefresh      = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swipeRefresh" }
androidx-fragment-ktx      = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }
androidx-activity-ktx      = { module = "androidx.activity:activity-ktx", version.ref = "activityKtx" }
androidx-recyclerview      = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerView" }

# Lifecycle / Navigation
androidx-lifecycle-viewmodel-ktx  = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx   = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx    = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-navigation-fragment-ktx  = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx        = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }

# Async
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

# Network — Retrofit + OkHttp + Moshi
retrofit                   = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-moshi   = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }
retrofit-converter-scalars = { module = "com.squareup.retrofit2:converter-scalars", version.ref = "retrofit" }
okhttp                     = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
moshi                      = { module = "com.squareup.moshi:moshi", version.ref = "moshi" }
moshi-kotlin               = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshi" }

# Logging
timber                     = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# Charts
mpandroidchart             = { module = "com.github.PhilJay:MPAndroidChart", version.ref = "mpAndroidChart" }

# Testing
junit                      = { module = "junit:junit", version.ref = "junit" }
mockito-core               = { module = "org.mockito:mockito-core", version.ref = "mockitoCore" }
mockito-kotlin             = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }
mockwebserver              = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
androidx-core-testing      = { module = "androidx.arch.core:core-testing", version.ref = "coreTesting" }
kotlinx-coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-test-core         = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-junit        = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-espresso-core     = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
