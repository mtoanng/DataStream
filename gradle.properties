# ==== JVM ===========================================================
# AGP 8 needs JDK 17+. We tune memory for an 8 GB laptop.
# Bump `-Xmx` to 4096m if you see "Java heap space" during sync.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# ==== Build performance ============================================
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
# AGP 8.2+ requires Gradle 8.2+; we ship 8.5. Daemon makes incremental builds fast.
org.gradle.daemon=true

# ==== AndroidX =====================================================
android.useAndroidX=true
# We don't depend on any legacy support libraries, so Jetifier is wasted CPU.
android.enableJetifier=false

# ==== Kotlin =======================================================
kotlin.code.style=official

# Generate per-module R class — slimmer build + safer namespacing.
android.nonTransitiveRClass=true

# Disable build features we don't use. (Keep buildconfig=true: NetworkModule
# uses BuildConfig.DEBUG to gate HttpLoggingInterceptor body logging.)
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false

# ==== Proxy (Bosch / Viettel / corporate Wi-Fi) ====================
# If Gradle sync fails on first run with "Could not resolve <coordinate>",
# you are probably behind an HTTPS proxy. Uncomment and fill the lines
# below, then File → Sync Project with Gradle Files.
#
# systemProp.http.proxyHost=
# systemProp.http.proxyPort=
# systemProp.http.nonProxyHosts=*.localhost|127.0.0.1|10.*|192.168.*|172.16.*
# systemProp.https.proxyHost=
# systemProp.https.proxyPort=
# systemProp.https.nonProxyHosts=*.localhost|127.0.0.1|10.*|192.168.*|172.16.*
#
# Authenticated proxies:
# systemProp.http.proxyUser=
# systemProp.http.proxyPassword=
# systemProp.https.proxyUser=
# systemProp.https.proxyPassword=
